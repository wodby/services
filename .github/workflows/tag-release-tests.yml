name: Test tag releases

on:
  pull_request:
    paths:
      - .github/workflows/tag-release.yml
      - .github/workflows/tag-release-tests.yml
      - tests/test_tag_release_workflow.py
  push:
    branches: [master]
    paths:
      - .github/workflows/tag-release.yml
      - .github/workflows/tag-release-tests.yml
      - tests/test_tag_release_workflow.py

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python -m unittest discover -s tests -p test_tag_release_workflow.py -v
