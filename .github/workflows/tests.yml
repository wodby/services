name: Test service maintenance scripts

on:
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install packaging pyyaml requests ruamel.yaml
      - run: python -m unittest discover -s tests
